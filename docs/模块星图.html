<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>小6 模块星图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
body { margin:0; font-family:"Microsoft YaHei",sans-serif; background:#1a1a2e; color:#eee; }
#chart { width:100vw; height:100vh; }
#detail {
  position:fixed; right:20px; top:20px; width:320px;
  background:rgba(255,255,255,0.08); border-radius:12px; padding:16px;
  backdrop-filter:blur(10px); display:none; z-index:99;
}
#detail h3 { margin:0 0 8px; color:#8bc8ea; }
#detail .row { margin:4px 0; font-size:13px; color:#ccc; }
#detail .close { float:right; cursor:pointer; color:#888; }
#status { position:fixed; left:10px; bottom:10px; font-size:11px; color:#666; }
</style>
</head>
<body>
<div id="chart"></div>
<div id="detail">
  <span class="close" onclick="document.getElementById('detail').style.display='none'">✕</span>
  <h3 id="d-name"></h3>
  <div class="row" id="d-desc"></div>
  <div class="row" id="d-status"></div>
  <div class="row" id="d-runtime"></div>
  <div class="row" id="d-links"></div>
</div>
<div id="status">加载中...</div>
<script src="../data/modules_map.js"></script>
<script>
const groupColors = {
  "核心":"#8bc8ea", "后台":"#94d8c3", "闭环":"#f4b393",
  "智能体":"#c9a7e8", "工具":"#a2ddaa", "高级":"#e1b98f", "L模块":"#eaa7b2",
  "记忆":"#e8c86a", "其他":"#888888"
};
let chart = echarts.init(document.getElementById('chart'));
let lastSig = "";

function render(data) {
  const calls = data.calls || [];
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { formatter: p => p.dataType==='node' ? (p.data.cn || p.data.name) : (p.data.meth ? (p.data.source+' → '+p.data.target+'：'+p.data.meth) : '') },
    series: [{
      type: 'graph', layout: 'force',
      force: { repulsion: 200, edgeLength: [60,120], gravity: 0.15 },
      roam: true,
      label: { show: true, fontSize: 12, color: '#fff', fontWeight: 'bold' },
      lineStyle: { color: 'rgba(255,255,255,0.25)', width: 1 },
      emphasis: { lineStyle: { width: 3, color: '#8bc8ea' } },
      data: data.modules.map(m => ({
        name: m.name,
        label: { formatter: (m.cn || m.name) + ((m.calls || 0) >= 2 ? ' ×' + m.calls : '') },
        // 调用越多点越大，一眼看出谁是热点模块
        symbolSize: (m.loaded ? 38 : 22) + Math.min(22, Math.round(Math.log2((m.calls || 0) + 1) * 6)),
        itemStyle: {
          color: groupColors[m.group] || '#888',
          borderColor: (m.error_rate > 0) ? '#ff6b6b' : (m.loaded ? '#fff' : '#555'),
          borderWidth: (m.error_rate > 0 || m.loaded) ? 2 : 1
        },
        cn: m.cn, desc: m.desc, group: m.group, loaded: m.loaded,
        calls: m.calls || 0, avg_ms: m.avg_ms || 0, error_rate: m.error_rate || 0
      })),
      links: [
        // 灰线 = 星型结构（每个模块都注册在躯干上）
        ...data.links.map(([s,t]) => ({ source: s, target: t })),
        // 橙线 = 真实的模块间调用（经 trunk.call 转接，一共就十来条）
        ...calls.map(c => ({ source: c[0], target: c[1], meth: c[2],
                             lineStyle: { color: '#f6a623', width: 2.5, curveness: 0.25, opacity: 0.95 } }))
      ]
    }]
  }, true);
  document.getElementById('status').textContent =
    '最后刷新: ' + new Date().toLocaleTimeString() + ' | 模块: ' + data.modules.length +
    ' | 星型连线: ' + data.links.length + ' | 橙线(真实调用): ' + calls.length +
    ' | 运行期调用总数: ' + data.modules.reduce((s, m) => s + (m.calls || 0), 0);
}

chart.on('click', function(p) {
  if (p.dataType !== 'node') return;
  const d = p.data;
  const data = window.MODULE_DATA;
  const connected = data.links.filter(([s,t]) => s===d.name || t===d.name).map(([s,t]) => s===d.name ? t : s);
  const cnMap = {};
  data.modules.forEach(m => cnMap[m.name] = m.cn || m.name);
  const cnConnected = connected.map(n => cnMap[n] || n);
  document.getElementById('d-name').textContent = (d.cn || d.name) + ' (' + d.name + ')';
  document.getElementById('d-desc').textContent = d.desc || '(无描述)';
  document.getElementById('d-status').textContent = (d.loaded ? '✅ 已加载' : '⏳ 懒加载') + ' | 分组: ' + d.group;
  document.getElementById('d-runtime').textContent =
    '运行态: 调用 ' + (d.calls || 0) + ' 次 | 平均 ' + (d.avg_ms || 0).toFixed(1) +
    'ms | 错误率 ' + ((d.error_rate || 0) * 100).toFixed(1) + '%';
  document.getElementById('d-links').textContent = '连接: ' + cnConnected.join(', ');
  document.getElementById('detail').style.display = 'block';
});

function sigOf(data) {
  // 运行态（调用次数/耗时/错误率）也算进签名：数据一变就重绘，不用等用户手动刷新
  return JSON.stringify(data.modules.map(m =>
    [m.name, m.loaded, m.calls || 0, m.avg_ms || 0, m.error_rate || 0]));
}

function refresh() {
  const old = document.getElementById('dynmap');
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = 'dynmap';
  s.src = '../data/modules_map.js?t=' + Date.now();
  s.onload = function() {
    if (window.MODULE_DATA) {
      const sig = sigOf(window.MODULE_DATA);
      if (sig !== lastSig) { render(window.MODULE_DATA); lastSig = sig; }
    }
  };
  document.head.appendChild(s);
}

if (window.MODULE_DATA) {
  render(window.MODULE_DATA);
  lastSig = sigOf(window.MODULE_DATA);
}
refresh();
setInterval(refresh, 3000);
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
