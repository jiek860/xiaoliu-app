version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "requests"
          - "numpy"
          - "cryptography"
          - "psutil"
      python-test:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage"
