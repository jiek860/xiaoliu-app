name: CI Full Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock
      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.lock
      - name: Workflow security policy
        run: python tools/check_workflow_security.py
      - name: Ruff
        run: python -m ruff check core gui modules/installed
      - name: Mypy
        run: python -m mypy
      - name: File size guard
        run: python tools/check_file_sizes.py

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-runtime.lock -r requirements-dev.lock
      - name: Generate plugin manifest
        run: python tools/rebuild_modules_repo.py --apply
      - name: Test and coverage gate
        run: |
          python -m coverage run --source=core,gui,modules -m pytest tests/ -q
          python -m coverage report --fail-under=58
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json
          python tools/check_coverage_thresholds.py --coverage coverage.json
          python tools/check_diff_coverage.py --coverage coverage.json --base origin/main --require-base
      - name: Agent E2E
        run: python tools/run_agent_e2e.py
      - name: Guard checks
        run: |
          python tools/check_shapes.py
          python tools/check_version.py
          python tools/check_buttons.py
          python tools/check_tools.py
          python tools/check_threads.py
          python tools/check_silent.py
          python tools/check_plugin_api.py
          python tools/check_runtime_compat.py --allow-server
          python tools/migrate_data.py --dry-run --json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-evidence
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 14

  ci-required:
    name: ci-required
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
