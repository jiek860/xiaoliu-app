name: 小6测试
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装依赖（走国内源）
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt pytest -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: 生成插件清单（CI 上没有 modules_repo）
        run: python tools/rebuild_modules_repo.py --apply
      - name: 跑测试
        run: python -m pytest tests/ -q
      - name: 跑守卫
        run: |
          python tools/check_shapes.py
          python tools/check_version.py
          python tools/check_buttons.py
          python tools/check_tools.py
          python tools/check_threads.py
          python tools/check_silent.py
