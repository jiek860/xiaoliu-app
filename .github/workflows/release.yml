# ci-policy: no-pull-request
name: Sign Release Artifact

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build workflow run id that produced xiao6-windows-build"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sign-release-${{ github.ref }}-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  sign:
    name: sign-release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Download immutable build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xiao6-windows-build
          path: dist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify build hashes before signing
        run: python tools/verify_artifact_manifest.py --dist dist
      - name: Require signing credentials
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "SIGNING_PFX_BASE64 is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "SIGNING_PFX_PASSWORD is not configured"
          }
      - name: Sign executables
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          .\tools\sign_artifact.ps1 -DistPath dist -PfxBase64 $env:SIGNING_PFX_BASE64 -PfxPassword $env:SIGNING_PFX_PASSWORD
      - name: Regenerate signed artifact manifest
        shell: pwsh
        run: |
          $rows = Get-ChildItem -Path dist -Recurse -File | Where-Object { $_.Name -ne "artifact-manifest.json" } | ForEach-Object {
            $h = Get-FileHash -Algorithm SHA256 -Path $_.FullName
            [ordered]@{
              path = $_.FullName.Substring((Resolve-Path dist).Path.Length + 1).Replace('\', '/')
              size = $_.Length
              sha256 = $h.Hash.ToLower()
            }
          }
          $manifest = [ordered]@{
            generated_at = (Get-Date).ToUniversalTime().ToString('o')
            commit = "${{ github.sha }}"
            build_run_id = "${{ inputs.build_run_id }}"
            signed = $true
            files = @($rows)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path dist\artifact-manifest.json -Encoding utf8
      - name: Verify signed artifact
        run: python tools/verify_artifact_manifest.py --dist dist
      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiao6-windows-signed
          path: dist/
          if-no-files-found: error
          retention-days: 90
