# ci-policy: no-pull-request
name: Portable Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "core/**"
      - "modules/**"
      - "gui/**"
      - "tools/build_portable.py"
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/build-portable.yml"

permissions:
  contents: read

concurrency:
  group: build-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Initialize pip cache
        run: python -m pip install --upgrade pip==26.2.1
      - name: Generate plugin manifest
        run: python tools/rebuild_modules_repo.py --apply
      - name: Python syntax check
        run: |
          python -m compileall -q core modules gui tools
      - name: Build portable archive
        run: |
          python tools/build_portable.py
      - name: Check artifact
        run: |
          python -c "import glob,os; files=glob.glob('build/xiao6-portable-*.zip'); assert files, 'portable zip not generated'; print(files[-1], os.path.getsize(files[-1]))"
      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiao6-portable-${{ matrix.os }}
          path: build/xiao6-portable-*.zip
          if-no-files-found: error
          retention-days: 14

  portable-required:
    name: portable-required
    if: always()
    needs: [portable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all portable builds to pass
        run: test "${{ needs.portable.result }}" = "success"