# ci-policy: no-pull-request
name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  push:
    paths:
      - "requirements*.txt"
      - "requirements*.lock"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security-audit
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-security.lock
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-runtime.lock -r requirements-security.lock
      - name: Secret scan
        run: python tools/check_secrets.py
      - name: Workflow supply-chain policy
        run: python tools/check_workflow_security.py
      - name: Bandit triage gate
        run: python tools/security_audit_triage.py --output security-audit-report.json
      - name: Dependency audit
        run: |
          python -m pip_audit -r requirements-runtime.lock -f json -o dependency-audit-runtime.json
          python -m pip_audit -r requirements-runtime-full.lock -f json -o dependency-audit-full.json
      - name: Generate CycloneDX SBOM
        run: python -m cyclonedx_py requirements requirements-runtime-full.lock -o sbom.cyclonedx.json
      - name: License inventory
        run: python tools/check_licenses.py --output license-report.json
      - name: Upload security evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-evidence
          path: |
            security-audit-report.json
            dependency-audit-runtime.json
            dependency-audit-full.json
            sbom.cyclonedx.json
            license-report.json
          if-no-files-found: error
          retention-days: 30

  security-required:
    name: security-required
    if: always()
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the security audit to pass
        run: test "${{ needs.security.result }}" = "success"