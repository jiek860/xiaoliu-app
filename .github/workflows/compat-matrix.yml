name: Compatibility Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Generate plugin manifest
        run: python tools/rebuild_modules_repo.py --apply
      - name: Runtime compatibility
        run: python tools/check_runtime_compat.py --allow-server
      - name: Syntax compile
        run: python -m compileall -q core gui modules
      - name: Data migration and plugin API checks
        run: |
          python tools/migrate_data.py --dry-run --json
          python tools/check_plugin_api.py
      - name: Core compatibility tests
        run: >-
          python -m pytest
          tests/test_smoke.py
          tests/test_core.py
          tests/test_imports.py
          tests/test_runtime_compat.py
          tests/test_data_schema.py
          tests/test_data_migrations.py
          tests/test_plugin_api.py
          tests/test_docs_consistency.py
          tests/test_file_size_policy.py
          tests/test_package_sync.py
          tests/test_user_docs_intact.py
          -q

  compat-required:
    name: compat-required
    if: always()
    needs: [windows-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the compatibility matrix to pass
        run: test "${{ needs.windows-python.result }}" = "success"
