# ci-policy: no-pull-request
name: Performance Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf-baseline
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-runtime.lock
      - name: Check performance against baseline
        run: python tools/perf_baseline.py --check > perf-current.json
      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-evidence
          path: perf-current.json
          if-no-files-found: error
          retention-days: 30
