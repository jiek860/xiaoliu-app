# ci-policy: no-pull-request
name: Performance Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf-baseline
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-runtime.lock
      - name: Check performance against baseline
        run: python tools/perf_baseline.py --check > perf-current.json
      - name: Upload performance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: perf-evidence
          path: perf-current.json
          if-no-files-found: error
          retention-days: 30
