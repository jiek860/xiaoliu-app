name: Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "core/**"
      - "gui/**"
      - "modules/**"
      - "xiao6.spec"
      - "requirements*.txt"
      - "requirements*.lock"
      - "tools/check_pyinstaller_output.py"
      - "tools/check_pyinstaller_warnings.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyinstaller:
    name: windows-build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-build.lock
      - name: Generate plugin manifest
        shell: pwsh
        run: python tools\rebuild_modules_repo.py --apply
      - name: Create clean build environment
        shell: pwsh
        run: |
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe -m pip install --upgrade pip==26.2.1
          .\.build-venv\Scripts\python.exe -m pip install -r requirements-runtime.lock -r requirements-build.lock
      - name: Build
        shell: pwsh
        run: |
          .\.build-venv\Scripts\python.exe -m PyInstaller --clean --noconfirm xiao6.spec
      - name: Check artifact
        shell: pwsh
        run: |
          python tools\check_pyinstaller_output.py --dist dist --launch-seconds 10
      - name: Check missing-module classification
        shell: pwsh
        run: |
          python tools\check_pyinstaller_warnings.py --warn build\xiao6\warn-xiao6.txt
      - name: Write artifact hash manifest
        shell: pwsh
        run: |
          $rows = Get-ChildItem -Path dist -Recurse -File | ForEach-Object {
            $h = Get-FileHash -Algorithm SHA256 -Path $_.FullName
            [ordered]@{
              path = $_.FullName.Substring((Resolve-Path dist).Path.Length + 1).Replace('\', '/')
              size = $_.Length
              sha256 = $h.Hash.ToLower()
            }
          }
          $manifest = [ordered]@{
            generated_at = (Get-Date).ToUniversalTime().ToString('o')
            commit = "${{ github.sha }}"
            files = @($rows)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path dist\artifact-manifest.json -Encoding utf8
          Get-FileHash -Algorithm SHA256 -Path dist\artifact-manifest.json | Format-List
      - name: Verify artifact hash manifest and sensitive-file scan
        shell: pwsh
        run: |
          python tools\verify_artifact_manifest.py --dist dist
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiao6-windows-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

  windows-build-required:
    name: windows-build-required
    if: always()
    needs: [pyinstaller]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Windows build to pass
        run: test "${{ needs.pyinstaller.result }}" = "success"
